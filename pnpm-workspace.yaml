# Not a monorepo — `packages` is only here so pnpm <10.5.0 accepts this
# settings file instead of failing with "packages field missing or empty".
packages:
  - '.'

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - esbuild
  - protobufjs
  - sharp
allowBuilds:
  better-sqlite3: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  # Cloudflare's runtime. This site deploys to Vercel, so its native build is
  # not needed. Left as a decision by the starter, which made `pnpm install`
  # exit non-zero and blocked the build.
  workerd: false
